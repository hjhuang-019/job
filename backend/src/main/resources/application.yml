server:
  port: 8080

spring:
  application:
    name: job-platform-backend
  profiles:
    # 本地开发默认使用 local，以便加载同目录下 application-local.yml（已 gitignore）
    # 生产环境请设置环境变量 SPRING_PROFILES_ACTIVE=prod 等
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://localhost:3306/job_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.jobplatform: debug

jwt:
  secret: ReplaceWithAStableSecretKeyForGraduationProject123456
  expiration: 86400000

app:
  upload-dir: uploads

# 豆包方舟（火山引擎）：请使用环境变量注入密钥，勿将真实 Key 写入仓库
# Windows PowerShell 示例：
#   $env:DOUBAO_ARK_API_KEY="你的Key"
#   $env:DOUBAO_ARK_MODEL="ep-xxxx"
doubao:
  ark:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${DOUBAO_ARK_API_KEY:}
    model: ${DOUBAO_ARK_MODEL:}
    max-user-chars: 2000